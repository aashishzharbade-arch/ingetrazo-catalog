en = "Align Tool"
pt = "Ferramenta Alinhar"

[summary]
es = "Alinea objetos por anclas de un cubo (seis manijas), en bloque o uno por uno; cada alineación se deshace en un paso. Mayús+S."
en = "Aligns objects by anchors on a cube (six handles), as a whole or one by one; each align is one undo step. Shift+S."
pt = "Alinha objetos por âncoras de um cubo (seis alças), em bloco ou um a um; cada alinhamento é um passo de desfazer. Shift+S."

[description]
en = "Two-phase align tool for IngeTrazo. Pick a source anchor from six cube handles, click the same cube again to toggle per-object mode (green = whole-selection, purple = per-object), click a target object and pick its anchor, then press Enter. Only the source moves; every align is one undo step. Toggle the tool with Shift+S."
