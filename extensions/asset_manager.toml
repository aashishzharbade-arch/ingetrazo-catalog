[summary]
es = "Los componentes del dibujo, tus carpetas de modelos .igz y .skp vigiladas en tiempo real, HDRI, materiales PBR y modelos 3D gratuitos de Poly Haven y ambientCG, y proxies: los modelos pesados como una envolvente ligera."
en = "The drawing's components, your folders of .igz and .skp models watched in real time, free HDRIs, full PBR materials and 3-D models from Poly Haven and ambientCG, and proxies: heavy models as a light envelope."
pt = "Os componentes do desenho, suas pastas de modelos .igz e .skp vigiadas em tempo real, HDRIs, materiais PBR e modelos 3D gratuitos do Poly Haven e ambientCG, e proxies: modelos pesados como uma envoltória leve."

[description]
en = "A tray tab with three pages. In drawing: every component once, with a preview and a count (dynamic ones marked; the parts inside a dynamic component are not listed); select every instance (also from the view's right-click menu); place a copy, or drag it onto the view. My catalog: folders of your own models, .igz and .skp (also inside .zip files), and material sets downloaded from any site; a .skp shows the preview it carries; each folder is watched in real time or read again with Update; insert by double-click or by dragging onto the view. A .skp comes in keeping its components and dynamic data when the «Parametric components from .skp» extension is installed, also when dragged from the file explorer. «Open a model site» opens, in the browser, the addresses you set. Online: CC0 assets from Poly Haven (HDRIs, materials, glTF models) and ambientCG (materials): an HDRI becomes Render Studio's 360° background, a material loads the paint bucket at its real size with all its maps and a .pbr.json manifest, a model follows the cursor to be placed. Proxies: with «As proxy» a model goes in as a light envelope (its convex hull) while the full model is kept in an .igz of its own next to the drawing; the right-click menu has Make proxy, Show original, Show proxy and Open original in a new tab (saved there, the envelope follows). One undo step each. The data is the «Proxies» extension's, so both work on either's proxies, and Render Studio renders the full models. Requests only reach each site's own servers over https; downloads are checked, cached and reused."
