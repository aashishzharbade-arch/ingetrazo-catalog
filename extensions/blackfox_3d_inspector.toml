en = "A read-only inspector for IngeTrazo models and extension APIs. Explore geometry, placements, selection, cameras and saved views. Copy the report or export it to TXT."
es = "Inspector de solo lectura para modelos y API de extensiones de IngeTrazo. Explora geometría, colocaciones, selección, cámaras y vistas guardadas. Copia el informe o expórtalo a TXT."
pt = "Inspetor somente leitura para modelos e APIs de extensões do IngeTrazo. Explore geometria, posicionamentos, seleção, câmeras e vistas salvas. Copie o relatório ou exporte-o para TXT."

[description]
en = """
BlackFox 3D Inspector helps extension developers, CAD users and AI assistants understand how an IngeTrazo document is structured and which APIs are available.

Four tabs organize the report. Scene shows geometry, topology, layers, materials, textures and annotations. Placements & selection shows nested groups, component transforms, shared meshes and selected entities. Camera & views shows camera settings, saved views, scene transitions and section planes. Developer APIs shows signatures, extension-data keys and Catenary compatibility checks.

Refresh reruns the inspection. Copy report copies all four tabs. Export to TXT saves the full UTF-8 report only after you choose a destination. Inspection leaves the model and its history unchanged.
"""
es = """
BlackFox 3D Inspector ayuda a desarrolladores de extensiones, usuarios de CAD y asistentes de IA a entender la estructura de un documento de IngeTrazo y las API disponibles.

Cuatro pestañas organizan el informe: escena con geometría, topología, capas, materiales, texturas y anotaciones; colocaciones y selección con grupos anidados, transformaciones, mallas compartidas y elementos seleccionados; cámara y vistas con vistas guardadas, transiciones y planos de sección; y API para desarrolladores con firmas, claves de datos de extensiones y comprobaciones de Catenary.

Puedes actualizar el informe, copiar las cuatro pestañas o exportarlas a TXT en UTF-8. El archivo solo se guarda al elegir un destino. La inspección mantiene intactos el modelo y su historial.
"""
pt = """
O BlackFox 3D Inspector ajuda desenvolvedores de extensões, usuários de CAD e assistentes de IA a entender a estrutura de um documento do IngeTrazo e as APIs disponíveis.

Quatro abas organizam o relatório: cena com geometria, topologia, camadas, materiais, texturas e anotações; posicionamentos e seleção com grupos aninhados, transformações, malhas compartilhadas e entidades selecionadas; câmera e vistas com vistas salvas, transições e planos de seção; e APIs para desenvolvedores com assinaturas, chaves de dados de extensões e verificações do Catenary.

Você pode atualizar o relatório, copiar as quatro abas ou exportá-las para TXT em UTF-8. O arquivo só é salvo ao escolher um destino. A inspeção preserva o modelo e seu histórico.
"""
