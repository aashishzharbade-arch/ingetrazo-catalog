[summary]
en = "Open, import and export .skp models. Downloads the matching converter with your permission when you first use an SKP command."
es = "Abre, importa y exporta modelos .skp. Descarga el conversor con tu permiso al usar por primera vez un comando SKP."
pt = "Abra, importe e exporte modelos .skp. Baixa o conversor com sua autorização no primeiro uso de um comando SKP."

[description]
en = """
Open a .skp model in its own document, import it into the current document, or export the whole IngeTrazo model or just the selection to SKP. BlackFox handles geometry, groups, components, tags, materials and saved views where the file and IngeTrazo support them.

If the converter is missing, an SKP command opens a dialog asking permission before any download. It shows the version, platform, size and destination. BlackFox verifies the downloaded executable and reuses it for later commands.

Some nested models preserve geometry and placements with limited support for materials, annotations, sections and cameras. Some texture mappings are approximated. Modern export options share an SKP container, and compatibility with every version of the format remains unverified. Building very large scenes may briefly pause the interface.
"""
es = """
Abre un modelo .skp en su propio documento, impórtalo en el documento activo o exporta a SKP el modelo completo de IngeTrazo o solo la selección. BlackFox admite geometría, grupos, componentes, etiquetas, materiales y vistas guardadas cuando el archivo e IngeTrazo lo permiten.

Si falta el conversor, al usar un comando SKP aparece un diálogo que pide permiso antes de descargarlo. Indica la versión, la plataforma, el tamaño y el destino. BlackFox verifica el ejecutable descargado y lo reutiliza en operaciones posteriores.

En algunos modelos anidados se conservan la geometría y la colocación de los elementos, con compatibilidad limitada para materiales, anotaciones, secciones y cámaras. Algunos mapeados de textura son aproximados. Las opciones de exportación modernas comparten un contenedor SKP y queda por verificar la compatibilidad con cada versión del formato. La creación de escenas muy grandes puede pausar brevemente la interfaz.
"""
pt = """
Abra um modelo .skp em um documento próprio, importe-o para o documento atual ou exporte para SKP o modelo inteiro do IngeTrazo ou apenas a seleção. O BlackFox trata geometria, grupos, componentes, etiquetas, materiais e vistas salvas quando o arquivo e o IngeTrazo oferecem suporte.

Se o conversor estiver ausente, um comando SKP abre uma caixa de diálogo solicitando autorização antes de baixar. Ela mostra a versão, a plataforma, o tamanho e o destino. O BlackFox verifica o executável baixado e o reutiliza nos próximos comandos.

Alguns modelos aninhados preservam geometria e posicionamento com suporte limitado a materiais, anotações, seções e câmeras. Alguns mapeamentos de textura são aproximados. As opções modernas de exportação compartilham um contêiner SKP, e a compatibilidade com cada versão do formato ainda precisa ser verificada. A criação de cenas muito grandes pode pausar brevemente a interface.
"""
