[summary]
en = "Brick, block and stone walling on a wall face: bonds, coursed ashlar, random rubble, dry-stone, Welsh slate; quoins, copings, heads and sills; bomb-site damage and rubble piles. Closed solids ready to print."
es = "Muros de ladrillo, bloque y piedra sobre una cara: aparejos, sillería, mampostería, piedra seca, pizarra; esquinales, albardillas, dinteles y alféizares; daños de bombardeo y montones de escombros. Listo para imprimir."
pt = "Alvenaria de tijolo, bloco e pedra numa face: aparelhos, cantaria, alvenaria irregular, pedra seca, ardósia; cunhais, capeamentos, padieiras e peitoris; danos de bombardeio e montes de entulho. Pronto a imprimir."
