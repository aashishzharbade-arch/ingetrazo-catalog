[summary]
es = "Chimeneas de ladrillo cortadas a la pendiente del tejado, con remate, cumbrera de mortero y sombreretes; chimeneas industriales; ventiladores y veletas. Haz clic en el edificio y la chimenea se coloca en la cumbrera."
en = "Brick chimney stacks cut to the roof slope, with oversailing courses, flaunching and pots; industrial chimneys; chimney pots; roof ventilators and weather vanes. Click the whole building and the stack stands on its ridge."
pt = "Chaminés de tijolo cortadas à inclinação do telhado, com cornija, argamassa e potes; chaminés industriais; ventiladores e cata-ventos. Clique no edifício inteiro e a chaminé fica na cumeeira."
