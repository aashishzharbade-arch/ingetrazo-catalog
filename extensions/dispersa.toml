pt = "Dispersa"

[summary]
es = "Reparte árboles, plantas, piedras o personas sobre caras, un grupo o el terreno, o los pinta con un pincel, con zonas libres. Tamaño y giro al azar, distancia mínima y semilla. Las copias comparten geometría: mil árboles pesan uno."
en = "Scatters trees, plants, stones or people over faces, a group or the terrain, or paints them with a brush, with zones kept clear. Random size and turn, a least distance and a seed. Copies share their geometry: a thousand trees weigh one."
pt = "Espalha árvores, plantas, pedras ou pessoas sobre faces, um grupo ou o terreno, ou as pinta com um pincel, com zonas livres. Tamanho e giro aleatórios, distância mínima e semente. As cópias compartilham a geometria: mil árvores pesam uma."
