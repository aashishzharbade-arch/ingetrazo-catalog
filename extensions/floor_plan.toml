[summary]
es = "Levanta el casco de un edificio desde su planta (rectángulo, L, T, U o tu propia forma): muros metidos según su grosor, partidos por plantas, con suelos, tabiques con puerta, zócalo y placa superior. Cada pieza se imprime tumbada."
en = "Builds a building's shell from its floor plan (rectangle, L, T, U or your own shape): walls set in by their thickness, split at each floor, with floors, room dividers with doorways, a plinth and a top plate. Every piece prints flat."
pt = "Levanta o casco de um edifício a partir da planta (retângulo, L, T, U ou forma própria): paredes recuadas pela espessura, divididas por piso, com pisos, divisórias com porta, plinto e placa de topo. Cada peça imprime-se deitada."
