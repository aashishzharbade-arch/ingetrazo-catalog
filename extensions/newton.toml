[name]
es = "Newton (física)"
en = "Newton (physics)"
pt = "Newton (física)"

[summary]
es = "Simulación de cuerpos rígidos en el modelo: caída, colisiones, ejes giratorios y lineales, motores, conexiones, cuerdas y panel de control. Reversible."
en = "Rigid-body simulation inside the model: falling, collisions, hinge and slide axes, motors, connections, ropes and a control panel. Fully reversible."
pt = "Simulação de corpos rígidos no modelo: queda, colisões, eixos giratórios e lineares, motores, conexões, cabos e painel de controle. Reversível."

[description]
en = "Turns groups and components into physics bodies, in the spirit of SketchyPhysics. Bodies can be dynamic, fixed or excluded, with mass, friction, bounce and collision shapes. Hinge and slide axes support limits, servo or motor drive and force limits; ball, pin and rigid connections close mechanisms such as a crank drive; ropes and cables are flexible fixed-length strands. Named controls drive the motors and passive bodies can be dragged with the mouse. The simulation can be reset to the starting state at any time. Requires a separate Python 3.12 (64-bit) with mujoco==3.3.7; Newton starts the physics in that interpreter as its own process (see the repository README)."
