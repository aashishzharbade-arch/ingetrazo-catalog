[summary]
en = "Puts rivets, bolts or any part along a line drawn over a surface (a boiler, a cab side), evenly spaced or at a pitch, each part standing square to the surface. One group you can edit again."
es = "Coloca remaches, pernos o cualquier pieza a lo largo de una línea sobre una superficie (una caldera, un lateral), a intervalos iguales o a un paso, cada pieza perpendicular a la superficie."
pt = "Coloca rebites, parafusos ou qualquer peça ao longo de uma linha sobre uma superfície (uma caldeira, uma lateral), igualmente espaçados ou a um passo, cada peça perpendicular à superfície."
