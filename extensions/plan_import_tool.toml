[summary]
es = "Importa planos y juegos de planos desde PDF vectorial a escala: plantas apiladas, alzados y cortes de pie, recorte automático, filtros (tramas, colores, piezas pequeñas), limpieza, punto de referencia, niveles y capas."
en = "Imports floor plans and whole plan sets from vector PDFs at scale: storeys stacked, elevations and sections upright, auto crop, filters (hatches, colours, small parts), clean up, reference point, levels and layers. Live preview."
pt = "Importa plantas e conjuntos de pranchas de PDF vetorial em escala: plantas empilhadas, fachadas e cortes em pé, recorte automático, filtros (hachuras, cores, peças pequenas), limpeza, ponto de referência, níveis e camadas."
