[name]
en = "Point Cloud & 3D Gaussian Splatting"
es = "Nube de Puntos y Gaussian Splatting 3D"
pt = "Nuvem de Pontos e Gaussian Splatting 3D"

[summary]
en = "Import, inspect, and snap to LiDAR/photogrammetry point clouds (.ply, .las, .laz, .xyz) and 3D Gaussian Splats (.splat) with accelerated viewport rendering, section box clipping, and Scan-to-BIM tools."
es = "Importación, inspección y ajuste (snap) a nubes de puntos LiDAR/fotogrametría (.ply, .las, .laz, .xyz) y Gaussian Splats 3D (.splat) con renderizado acelerado, caja de sección y herramientas Scan-to-BIM."
pt = "Importação, inspeção e snap em nuvens de pontos LiDAR/fotogrametria (.ply, .las, .laz, .xyz) e Gaussian Splats 3D (.splat) com renderização acelerada, caixa de corte e ferramentas Scan-to-BIM."

[description]
en = "High-performance reality-capture extension for IngeTrazo supporting LiDAR, photogrammetry point clouds (.ply, .las, .laz, .xyz, .pts, .txt, .csv), and 3D Gaussian Splats (.ply, .splat). Includes a SIMD/multi-threaded C rasterizer (up to 60+ FPS with dynamic LOD), True Color RGB/SH, Elevation colormaps (Turbo, Viridis, Jet, Terrain), Intensity and Normal shading, interactive 3D Section Box clipping, native CAD snapping, and undoable Scan-to-BIM tools (RANSAC dominant plane fitting, 3D bounding box, and guide points). What's New in v1.0.2: Platform-specific native C library loading and OpenMP multi-threading on Linux; vectorized int32 NumPy 2 fallback for Gaussian Splats with a 4,000-splat frame budget; undoable point cloud import/removal (Ctrl+Z) and automatic .igz proxy sync; plus v1.0.1 true 3D OpenGL depth-buffer occlusion and non-blocking CAD selection inside scans."
es = "Extensión de captura de realidad de alto rendimiento para IngeTrazo compatible con nubes de puntos LiDAR y fotogrametría (.ply, .las, .laz, .xyz, .pts, .txt, .csv) y Gaussian Splats 3D (.ply, .splat). Incluye rasterizador en C multihilo (hasta 60+ FPS con LOD dinámico), modos RGB/SH, mapas de elevación (Turbo, Viridis, Jet, Terrain), intensidad y normales, caja de sección 3D, ajuste (snap) nativo para dibujo CAD y herramientas Scan-to-BIM con soporte de deshacer (plano dominante RANSAC, caja delimitadora y puntos guía). Novedades en v1.0.2: carga de librería nativa por plataforma y multihilo OpenMP en Linux; fallback vectorizado int32 compatible con NumPy 2 para Gaussian Splats (límite de 4.000 splats/cuadro); soporte de deshacer (Ctrl+Z) al importar/eliminar nubes y sincronización con archivos .igz; además de oclusión 3D OpenGL y selección CAD sin bloqueos."
pt = "Extensão de captura da realidade de alto desempenho para IngeTrazo compatível com nuvens de puntos LiDAR e fotogrametria (.ply, .las, .laz, .xyz, .pts, .txt, .csv) e Gaussian Splats 3D (.ply, .splat). Inclui rasterizador em C multithread (até 60+ FPS com LOD dinâmico), modos RGB/SH, mapas de elevação (Turbo, Viridis, Jet, Terrain), intensidade e normais, caixa de corte 3D, snap nativo para ferramentas CAD e recursos Scan-to-BIM com suporte a desfazer (plano dominante RANSAC, caixa delimitadora e pontos de guia). Novidades na v1.0.2: carregamento nativo por plataforma e multithread OpenMP no Linux; fallback vetorizado int32 compatível com NumPy 2 para Gaussian Splats (limite de 4.000 splats/quadro); suporte a desfazer (Ctrl+Z) ao importar/remover nuvens e sincronização com .igz; além de oclusão 3D OpenGL e seleção CAD sem bloqueios."
