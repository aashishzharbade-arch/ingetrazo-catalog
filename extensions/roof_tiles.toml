[summary]
es = "Cubre un faldón con tejas planas, pizarras o tejas con forma, solapadas o planas para imprimir, con cumbrera y remates. Elige una cara o todo el edificio y se tejan todos los faldones a la vez, cada pieza aparte para imprimir."
