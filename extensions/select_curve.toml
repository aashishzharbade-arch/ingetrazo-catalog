[summary]
en = "Select a whole chain of connected edges with one click: it follows visible edges and stops at forks, dead ends and closed loops. Live preview under the cursor; modifiers to add, remove or toggle."
es = "Selecciona de un clic una cadena entera de aristas conectadas: sigue las aristas visibles y para en bifurcaciones, extremos y bucles cerrados. Vista previa bajo el cursor y teclas para añadir, quitar o alternar."
pt = "Seleciona com um clique uma cadeia inteira de arestas conectadas: segue as arestas visíveis e para em bifurcações, extremidades e laços fechados. Prévia sob o cursor e teclas para adicionar, remover ou alternar."
