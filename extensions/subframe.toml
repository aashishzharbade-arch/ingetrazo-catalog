[summary]
es = "Pone un armazón de refuerzo tras las paredes y bajo el tejado, a cualquier escala: soleras, postes, dinteles, montantes, riostras, cabios y correas, o barras que siguen tus líneas. Cada barra es una pieza que se imprime tumbada."
en = "Puts a strengthening frame behind walls and under roofs of any shape, at any scale: plates, posts, lintels, studs, braces, rafters and purlins, or bars that follow lines you draw. Every bar is its own piece that prints flat."
pt = "Coloca uma estrutura de reforço atrás das paredes e sob o telhado, a qualquer escala: soleiras, postes, padieiras, montantes, travamentos, caibros e madres, ou barras que seguem as suas linhas. Cada barra imprime-se deitada."
