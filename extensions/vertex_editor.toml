[summary]
es = "Mueve un vértice de la malla activa con vista previa, bloqueo de ejes y distancia exacta. Al coincidir con otro, intenta unirlos y revierte la operación si detecta nuevos defectos topológicos."
en = "Move one vertex of the active mesh with a live preview, axis locking and exact distance entry. Coincident vertices can be welded; the edit is reverted if basic topology checks find new defects."
pt = "Move um vértice da malha ativa com prévia, trava de eixos e medida exata. Pode unir vértices coincidentes e reverte a edição se a verificação básica detectar novos defeitos topológicos."
